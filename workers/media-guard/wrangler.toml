name = "bm-media-guard"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = false

[vars]
ALLOWED_HOSTS = "www.brandmultiplier.ai,brandmultiplier.ai,localhost,127.0.0.1"

[[routes]]
pattern = "media.brandmultiplier.ai"
custom_domain = true

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "bm-video"
